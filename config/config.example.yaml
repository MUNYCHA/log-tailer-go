redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0

identity:
  serverId: your-server-id

logTailer:
  enabled: true
  # path is an exact file, or a wildcard for a name that changes (e.g. daily):
  #   ?  exactly 1 character    *  any characters    never matches /
  # A wildcard follows only the newest matching file. See README.
  files:
    - path: /var/log/app/app.log                # exact
      channel: your-channel-1
    - path: /var/log/app/error.log              # exact
      channel: your-channel-2
    - path: /var/log/app/daily-????-??-??.log   # matches daily-2026-10-20.log
      channel: your-channel-3
    - path: /var/log/app/worker*.log            # matches worker.log, worker-1.log
      channel: your-channel-4

resources:
  enabled: true
  channel: your-resources-channel
  interval: 30s

storage:
  enabled: true
  channel: your-storage-channel
  interval: 5m
  mounts:                       # optional; the server total works without it
    - /
    - /var/log

docker:
  enabled: true                 # reads the Docker socket, read-only
  channel: your-docker-channel
  interval: 30s

database:
  postgres:
    enabled: true               # local socket + peer auth, no password; see README
    channel: your-postgres-channel
    interval: 1m

heartbeat:
  enabled: true                 # omit the whole block to get the same defaults
  channel: agent-heartbeat      # must match what the consumer subscribes to
  interval: 10s                 # coordinate with the consumer's TTL before changing
