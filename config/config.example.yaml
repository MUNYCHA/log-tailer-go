redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0

identity:
  serverId: your-server-id

logTailer:
  enabled: true
  files:
    - path: /var/log/app/app.log
      channel: your-channel-1
    - path: /var/log/app/error.log
      channel: your-channel-2

resources:
  enabled: true
  channel: your-resources-channel
  interval: 30s

storage:
  enabled: true
  channel: your-storage-channel
  interval: 5m
  mounts:                       # optional; the server total works without it
    - /
    - /var/log

heartbeat:
  enabled: true                 # omit the whole block to get the same defaults
  channel: agent-heartbeat      # must match what the consumer subscribes to
  interval: 10s                 # coordinate with the consumer's TTL before changing
